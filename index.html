<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIST Bot">
<meta name="theme-color" content="#0a0e14">
<title>BIST ATR Botu | Stabil Proxy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root{
  --bg:#0a0e14;--bg2:#111620;--border:#1e2a3a;
  --text:#c8d4e0;--muted:#4a5a6e;--accent:#00d4aa;
  --red:#ff4757;--green:#00d4aa;--amber:#ffa502;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;padding-top:var(--safe-top);padding-bottom:calc(var(--safe-bot) + 72px)}
.header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.08em}
.badge{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.06em;display:block;margin-top:2px}
.ts{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(var(--safe-bot) + 10px);background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:10px;z-index:200}
.run-btn{flex:1;background:var(--accent);color:#000;border:none;padding:14px;border-radius:10px;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer}
.run-btn:disabled{opacity:.4}
.reset-btn{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.3);padding:14px 18px;border-radius:10px;font-family:var(--mono);font-size:13px;cursor:pointer}
.main{padding:14px 14px 8px}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.stat-card.wide{grid-column:1/-1}
.stat-label{font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:5px;font-family:var(--mono)}
.stat-value{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);line-height:1}
.stat-value.positive{color:var(--green)}.stat-value.negative{color:var(--red)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.card-header{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:10px;font-family:var(--mono);font-weight:500}
.tag-buy{background:rgba(0,212,170,.15);color:var(--green);border:1px solid rgba(0,212,170,.25)}
.tag-wait{background:rgba(74,90,110,.2);color:var(--muted);border:1px solid var(--border)}
.tag-block{background:rgba(255,165,2,.12);color:var(--amber);border:1px solid rgba(255,165,2,.25)}
.signal-row{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(30,42,58,.5);gap:8px}
.signal-row:last-child{border-bottom:none}
.sig-ticker{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);min-width:58px}
.sig-price{font-family:var(--mono);font-size:11px;color:var(--muted);flex:1}
.sig-score{display:flex;gap:2px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border)}
.dot.on{background:var(--accent)}.dot.half{background:rgba(0,212,170,.35)}
.sig-macd{font-family:var(--mono);font-size:10px;min-width:28px;text-align:center}
.pos-item{padding:12px 14px;border-bottom:1px solid rgba(30,42,58,.5)}
.pos-item:last-child{border-bottom:none}
.pos-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pos-ticker{font-family:var(--mono);font-size:15px;font-weight:600}
.pos-pnl{font-family:var(--mono);font-size:14px;font-weight:600}
.pos-mid{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:5px}
.pos-atr{font-family:var(--mono);font-size:10px;color:var(--amber);margin-bottom:5px}
.prog-bg{background:var(--border);border-radius:3px;height:5px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px}
.trade-item{padding:11px 14px;border-bottom:1px solid rgba(30,42,58,.5)}
.trade-item:last-child{border-bottom:none}
.trade-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.trade-ticker{font-family:var(--mono);font-size:13px;font-weight:600}
.trade-price{font-family:var(--mono);font-size:11px;color:var(--muted);flex:1}
.trade-bot{font-family:var(--mono);font-size:10px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.pct-up{color:var(--green)}.pct-dn{color:var(--red)}.amber{color:var(--amber)}
.filters-row{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filter-pill{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:transparent}
.filter-pill.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,170,.08)}
.info-note{background:rgba(0,212,170,.05);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:11px;font-family:var(--mono);color:var(--muted);text-align:center}
</style>
</head>
<body>

<div class="header">
  <div>
    <span class="logo">BIST // ATR BOT</span>
    <span class="badge">PAPER TRADING</span>
  </div>
  <div class="ts" id="ts">—</div>
</div>

<div class="main">
  <div class="info-note">
    ⚡ Sayfa açılışında otomatik taranır. "ANALİZ ET" ile manuel taratabilirsiniz.
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Portföy</div><div class="stat-value" id="s-portfolio">—</div><div class="stat-sub">TL</div></div>
    <div class="stat-card"><div class="stat-label">Getiri</div><div class="stat-value" id="s-return">—</div><div class="stat-sub" id="s-pnl-abs">10.000 TL başlangıç</div></div>
    <div class="stat-card"><div class="stat-label">Nakit</div><div class="stat-value" id="s-cash">—</div><div class="stat-sub">TL</div></div>
    <div class="stat-card"><div class="stat-label">Kazanma</div><div class="stat-value" id="s-winrate">—</div><div class="stat-sub" id="s-trades">işlem yok</div></div>
    <div class="stat-card wide"><div class="stat-label">Toplam Kâr</div><div class="stat-value" id="s-profit">—</div></div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">Sinyaller</span><span class="tag tag-wait" id="scan-status">Taranmadı</span></div>
    <div class="filters-row">
      <button class="filter-pill active" onclick="setFilter('all',this)">Tümü</button>
      <button class="filter-pill" onclick="setFilter('buy',this)">Alış</button>
      <button class="filter-pill" onclick="setFilter('block',this)">Engellenen</button>
    </div>
    <div id="signals-list"><div class="empty">▶ ANALİZ ET'e basın</div></div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">Açık Pozisyonlar</span><span id="pos-count" class="tag tag-wait">0</span></div>
    <div id="positions-body"><div class="empty">Pozisyon yok</div></div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title">İşlem Geçmişi</span><span id="log-count" class="tag tag-wait">0</span></div>
    <div id="trades-list"><div class="empty">Geçmiş yok</div></div>
  </div>
</div>

<div class="bottom-bar">
  <button class="reset-btn" onclick="resetPortfolio()">↺</button>
  <button class="run-btn" id="runBtn" onclick="runBot()">▶ ANALİZ ET</button>
</div>

<script>
const IC=10000, MAX_POS=.20, COM=.001, VMA=20, MINSCORE=3;
const VSPIKE=2.0, ATR_PERIOD=14, ATR_SL_MULT=1.8, ATR_TP_MULT=3.0;
const PUMP_SPIKE_MAX=5.0, PUMP_PRICE_MAX=0.04;
const WL=["THYAO.IS","GARAN.IS","AKBNK.IS","EREGL.IS","KCHOL.IS","SAHOL.IS","ISCTR.IS","PETKM.IS","TOASO.IS","SISE.IS"];

// Birden fazla proxy - biri çalışmazsa diğeri dene
const PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
  'https://cors-anywhere.herokuapp.com/'
];

let S=load('bist_p2',{cash:IC,initialCapital:IC,positions:{},createdAt:new Date().toISOString()});
let LOG=load('bist_l2',[]);
let RES=[];
let activeFilter='all';
let isScanning=false;

function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function saveS(){save('bist_p2',S);}
function saveL(){save('bist_l2',LOG);}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderSignals();
}

function resetPortfolio(){
  if(!confirm('Portföy ve geçmiş silinecek. Emin misiniz?'))return;
  ['bist_p2','bist_l2'].forEach(k=>localStorage.removeItem(k));
  S=load('bist_p2',{cash:IC,initialCapital:IC,positions:{},createdAt:new Date().toISOString()});
  LOG=load('bist_l2',[]);RES=[];renderAll();
}

async function fetchWithProxy(ticker, proxyIndex=0){
  if(proxyIndex >= PROXIES.length) throw new Error('Tüm proxy\'ler denendi, başarısız');
  const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=4mo`;
  const proxyUrl = PROXIES[proxyIndex];
  let url;
  if(proxyUrl.includes('allorigins')){
    url = proxyUrl + encodeURIComponent(targetUrl);
  } else {
    url = proxyUrl + encodeURIComponent(targetUrl);
  }
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    if(proxyUrl.includes('allorigins') && d.contents){
      const realData = JSON.parse(d.contents);
      return realData;
    }
    return d;
  } catch(e){
    console.warn(`Proxy ${proxyIndex} başarısız:`, e);
    return fetchWithProxy(ticker, proxyIndex+1);
  }
}

async function fetchOHLCV(ticker){
  const d = await fetchWithProxy(ticker, 0);
  const r = d.chart.result[0];
  if(!r) throw new Error('Veri bulunamadı');
  const q = r.indicators.quote[0];
  return r.timestamp.map((t,i)=>({
    date:new Date(t*1000), open:q.open[i], high:q.high[i],
    low:q.low[i], close:q.close[i], volume:q.volume[i]
  })).filter(r=>r.close!=null && r.volume!=null);
}

function indicators(rows){
  const n=rows.length;
  for(let i=0;i<n;i++){
    const sv=rows.slice(Math.max(0,i-VMA+1),i+1);
    rows[i].vol_ma=sv.reduce((a,b)=>a+b.volume,0)/sv.length;
    rows[i].vol_ratio=rows[i].volume/(rows[i].vol_ma||1);
    rows[i].day_chg=i>0?(rows[i].close-rows[i-1].close)/rows[i-1].close:0;
    rows[i].ma5=rows.slice(Math.max(0,i-4),i+1).reduce((a,b)=>a+b.close,0)/Math.min(5,i+1);
    rows[i].ma20=rows.slice(Math.max(0,i-19),i+1).reduce((a,b)=>a+b.close,0)/Math.min(20,i+1);
  }
  for(let i=0;i<n;i++){
    const tr=i===0?rows[i].high-rows[i].low:Math.max(
      rows[i].high-rows[i].low,
      Math.abs(rows[i].high-rows[i-1].close),
      Math.abs(rows[i].low-rows[i-1].close)
    );
    rows[i].tr=tr;
  }
  rows[0].atr=rows[0].tr;
  const atrK=2/(ATR_PERIOD+1);
  for(let i=1;i<n;i++) rows[i].atr=rows[i].tr*atrK+rows[i-1].atr*(1-atrK);
  
  rows[0].obv=0;
  for(let i=1;i<n;i++) rows[i].obv=rows[i-1].obv+(rows[i].close>rows[i-1].close?rows[i].volume:rows[i].close<rows[i-1].close?-rows[i].volume:0);
  for(let i=0;i<n;i++){
    const sl=rows.slice(Math.max(0,i-9),i+1);
    rows[i].obv_ma=sl.reduce((a,b)=>a+b.obv,0)/sl.length;
  }
  for(let i=0;i<n;i++){
    const s20=rows.slice(Math.max(0,i-19),i+1);
    const tpv=s20.reduce((a,r)=>a+(r.high+r.low+r.close)/3*r.volume,0);
    rows[i].vwap=tpv/s20.reduce((a,r)=>a+r.volume,0);
  }
  function ema(arr,period){
    const k=2/(period+1),out=new Array(arr.length).fill(null);
    let start=0;while(start<arr.length&&arr[start]==null)start++;
    if(start===arr.length) return out;
    out[start]=arr[start];
    for(let i=start+1;i<arr.length;i++) out[i]=arr[i]*k+out[i-1]*(1-k);
    return out;
  }
  const closes=rows.map(r=>r.close);
  const ema12=ema(closes,12),ema26=ema(closes,26);
  const macdLine=ema12.map((v,i)=>v!=null&&ema26[i]!=null?v-ema26[i]:null);
  const signalLine=ema(macdLine,9);
  for(let i=0;i<n;i++){
    rows[i].macd=macdLine[i];
    rows[i].macd_signal=signalLine[i];
    rows[i].macd_hist=macdLine[i]!=null&&signalLine[i]!=null?macdLine[i]-signalLine[i]:null;
  }
  for(let i=14;i<n;i++){
    let g=0,l=0;
    for(let j=i-13;j<=i;j++){const d=rows[j].close-rows[j-1].close;if(d>0)g+=d;else l-=d;}
    rows[i].rsi=100-100/(1+(g/(l||1)));
  }
  return rows;
}

function isPump(L){
  return (L.vol_ratio||0)>PUMP_SPIKE_MAX && Math.abs(L.day_chg||0)>PUMP_PRICE_MAX;
}

function signal(rows){
  if(rows.length<30) return {action:'BEKLE',score:0,reasons:[],blocked:null,price:0,vol_ratio:0,rsi:null,atr:0,macd_ok:false};
  const L=rows[rows.length-1], P=rows[rows.length-2];
  if(isPump(L)) return {action:'ENGEL',score:0,blocked:'pump_dump',reasons:[],price:L.close,vol_ratio:L.vol_ratio||0,rsi:L.rsi||null,atr:L.atr||0,macd_ok:false};
  const macdOk = L.macd!=null && L.macd_signal!=null && L.macd_hist>0;
  let sc=0;
  if((L.vol_ratio||0)>=VSPIKE) sc+=1;
  if(L.obv>L.obv_ma && P.obv<=P.obv_ma) sc+=1;
  else if(L.obv>L.obv_ma) sc+=0.5;
  if(L.close>L.vwap) sc+=1;
  if(L.ma5>L.ma20 && P.ma5<=P.ma20) sc+=1.5;
  else if(L.ma5>L.ma20) sc+=0.5;
  if(L.rsi!=null){if(L.rsi<35) sc+=1; else if(L.rsi<65) sc+=0.5;}
  if(macdOk) sc+=0.5;
  sc=Math.min(parseFloat(sc.toFixed(1)),5.5);
  let blocked=null, action='BEKLE';
  if(sc>=MINSCORE){
    if(!macdOk){blocked='macd_neg'; action='ENGEL';}
    else action='ALIŞ';
  }
  return {action,score:sc,blocked,price:L.close,vol_ratio:L.vol_ratio||0,rsi:L.rsi||null,atr:L.atr||0,macd_ok:macdOk,reasons:[]};
}

function calcSLTP(price,atr){ return { stop_loss: price - atr*ATR_SL_MULT, take_profit: price + atr*ATR_TP_MULT }; }
function buy(ticker,sig){
  if(S.positions[ticker]) return null;
  const inv=Math.min(S.initialCapital*MAX_POS, S.cash*.95);
  if(inv<100) return null;
  const com=inv*COM, qty=(inv-com)/sig.price;
  const {stop_loss,take_profit}=calcSLTP(sig.price,sig.atr);
  S.cash-=inv;
  S.positions[ticker]={qty,buy_price:sig.price,buy_date:new Date().toISOString(), stop_loss,take_profit,atr:sig.atr,signal_score:sig.score,invest_amount:inv};
  saveS();
  LOG.unshift({action:'ALIŞ',ticker,price:sig.price,qty,invest:inv,commission:com,stop_loss,take_profit,sl_pct:((sig.price-stop_loss)/sig.price*100).toFixed(1),tp_pct:((take_profit-sig.price)/sig.price*100).toFixed(1),signal_score:sig.score,timestamp:new Date().toISOString()});
  saveL();
  return true;
}
function checkExit(ticker,price){
  const p=S.positions[ticker]; if(!p) return null;
  if(price<=p.stop_loss) return sell(ticker,price,'STOP-LOSS');
  if(price>=p.take_profit) return sell(ticker,price,'TAKE-PROFIT');
  return null;
}
function sell(ticker,price,reason){
  const p=S.positions[ticker]; if(!p) return null;
  const gross=p.qty*price, com=gross*COM, net=gross-com;
  const profit=net-p.invest_amount, pct=profit/p.invest_amount*100;
  S.cash+=net; delete S.positions[ticker]; saveS();
  LOG.unshift({action:'SATIŞ',ticker,price,qty:p.qty,gross,commission:com,net,profit,profit_pct:pct,reason,buy_price:p.buy_price,timestamp:new Date().toISOString()});
  saveL();
  return true;
}

async function runBot(){
  if(isScanning) return;
  isScanning=true;
  const btn=document.getElementById('runBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Analiz...';
  document.getElementById('scan-status').textContent='Taranıyor...';
  document.getElementById('ts').textContent=new Date().toLocaleString('tr-TR');
  RES=[];
  for(const ticker of WL){
    try{
      const rows=await fetchOHLCV(ticker);
      const sig=signal(indicators(rows));
      if(S.positions[ticker]) checkExit(ticker,sig.price);
      else if(sig.action==='ALIŞ') buy(ticker,sig);
      RES.push({ticker,signal:sig});
    }catch(e){
      console.warn(ticker, e);
      RES.push({ticker,signal:{action:'BEKLE',score:0,blocked:null,price:0,vol_ratio:0,atr:0,macd_ok:false}});
    }
    renderAll();
    await new Promise(r=>setTimeout(r,400));
  }
  btn.disabled=false; btn.innerHTML='▶ ANALİZ ET';
  const blocked=RES.filter(r=>r.signal.blocked).length;
  document.getElementById('scan-status').textContent=`${WL.length} hisse${blocked?` · ${blocked} engel`:''}`;
  document.getElementById('scan-status').className='tag tag-buy';
  isScanning=false;
}

function pv(){
  let v=S.cash;
  for(const[t,p]of Object.entries(S.positions)){
    const r=RES.find(r=>r.ticker===t);
    v+=p.qty*(r?r.signal.price:p.buy_price);
  }
  return v;
}
function dots(score){
  return[1,2,3,4,5].map(i=>`<span class="dot${score>=i?' on':score>=i-.5?' half':''}"></span>`).join('');
}
function renderAll(){
  const val=pv(), ret=(val/IC-1)*100, pnl=val-IC;
  document.getElementById('s-portfolio').textContent=val.toLocaleString('tr-TR',{minimumFractionDigits:2});
  const re=document.getElementById('s-return'); re.textContent=(ret>=0?'+':'')+ret.toFixed(2)+'%'; re.className='stat-value '+(ret>=0?'positive':'negative');
  document.getElementById('s-pnl-abs').textContent=(pnl>=0?'+':'')+pnl.toFixed(0)+' TL';
  document.getElementById('s-cash').textContent=S.cash.toLocaleString('tr-TR');
  const sales=LOG.filter(t=>t.action==='SATIŞ');
  if(sales.length){
    const wins=sales.filter(t=>t.profit>0), wr=(wins.length/sales.length*100).toFixed(1), tp=sales.reduce((a,t)=>a+t.profit,0);
    const we=document.getElementById('s-winrate'); we.textContent=wr+'%'; we.className='stat-value '+(wr>=50?'positive':'negative');
    document.getElementById('s-trades').textContent=`${sales.length} işlem`;
    const pe=document.getElementById('s-profit'); pe.textContent=(tp>=0?'+':'')+tp.toFixed(2)+' TL'; pe.className='stat-value '+(tp>=0?'positive':'negative');
  }
  renderSignals(); renderPositions(); renderTrades();
}
function renderSignals(){
  if(!RES.length) return;
  let filtered=RES;
  if(activeFilter==='buy') filtered=RES.filter(r=>r.signal.action==='ALIŞ');
  if(activeFilter==='block') filtered=RES.filter(r=>r.signal.blocked);
  if(!filtered.length){document.getElementById('signals-list').innerHTML='<div class="empty">Sonuç yok</div>';return;}
  document.getElementById('signals-list').innerHTML=filtered.map(r=>{
    const s=r.signal;
    let tagHtml;
    if(s.action==='ALIŞ') tagHtml='<span class="tag tag-buy">ALIŞ</span>';
    else if(s.blocked==='pump_dump') tagHtml='<span class="tag tag-block">PUMP</span>';
    else if(s.blocked==='macd_neg') tagHtml='<span class="tag tag-block">MACD↓</span>';
    else tagHtml='<span class="tag tag-wait">BEKLE</span>';
    const macdIcon=s.macd_ok?'<span class="sig-macd pct-up">▲</span>':'<span class="sig-macd pct-dn">▼</span>';
    return`<div class="signal-row"><div class="sig-ticker">${r.ticker.replace('.IS','')}</div><div class="sig-price">${s.price?s.price.toFixed(2):'—'}</div><div class="sig-score">${dots(s.score)}</div>${macdIcon}${tagHtml}</div>`;
  }).join('');
}
function renderPositions(){
  const entries=Object.entries(S.positions);
  document.getElementById('pos-count').textContent=entries.length;
  if(!entries.length){document.getElementById('positions-body').innerHTML='<div class="empty">Pozisyon yok</div>';return;}
  document.getElementById('positions-body').innerHTML=entries.map(([t,p])=>{
    const r=RES.find(r=>r.ticker===t), cur=r?r.signal.price:p.buy_price;
    const pnl2=(cur/p.buy_price-1)*100, pnlAbs=p.qty*(cur-p.buy_price);
    const range=p.take_profit-p.stop_loss, pct2=Math.max(0,Math.min(100,(cur-p.stop_loss)/range*100));
    const slPct=((p.buy_price-p.stop_loss)/p.buy_price*100).toFixed(1);
    const tpPct=((p.take_profit-p.buy_price)/p.buy_price*100).toFixed(1);
    return`<div class="pos-item"><div class="pos-top"><span class="pos-ticker">${t.replace('.IS','')}</span><span class="pos-pnl ${pnl2>=0?'pct-up':'pct-dn'}">${pnl2>=0?'+':''}${pnl2.toFixed(1)}%</span></div><div class="pos-atr">ATR stop: -%${slPct} · hedef: +%${tpPct}</div><div class="pos-mid"><span>SL ${p.stop_loss.toFixed(2)}</span><span>${cur.toFixed(2)}</span><span>TP ${p.take_profit.toFixed(2)}</span></div><div class="prog-bg"><div class="prog-fill" style="width:${pct2}%;background:${pnl2>=0?'var(--green)':'var(--red)'}"></div></div><div style="font-size:10px">${pnlAbs>=0?'+':''}${pnlAbs.toFixed(0)} TL · ${p.qty.toFixed(1)} adet</div></div>`;
  }).join('');
}
function renderTrades(){
  document.getElementById('log-count').textContent=LOG.length;
  if(!LOG.length){document.getElementById('trades-list').innerHTML='<div class="empty">Geçmiş yok</div>';return;}
  document.getElementById('trades-list').innerHTML=LOG.slice(0,40).map(t=>{
    const dt=new Date(t.timestamp);
    const ts2=dt.toLocaleDateString('tr-TR')+' '+dt.toLocaleTimeString('tr-TR');
    const tag=t.action==='ALIŞ'?'tag-buy':t.profit>=0?'tag-tp':'tag-sl';
    const pnlC=t.action==='SATIŞ'?`<span class="${t.profit>=0?'pct-up':'pct-dn'}">${t.profit>=0?'+':''}${t.profit.toFixed(2)} TL</span>`:'';
    return`<div class="trade-item"><div class="trade-top"><span class="tag ${tag}">${t.action}</span><span class="trade-ticker">${t.ticker.replace('.IS','')}</span><span class="trade-price">${t.price.toFixed(2)} TL</span>${pnlC}</div><div class="trade-bot">${ts2}</div></div>`;
  }).join('');
}

document.getElementById('ts').textContent=new Date().toLocaleString('tr-TR');
renderAll();
window.addEventListener('load',()=>setTimeout(runBot,1000));
</script>
